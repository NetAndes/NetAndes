media: assets
content:
  - name: datos
    label: Datos de NetAndes
    type: file
    path: data.json
    format: json
    fields:
      - name: empresa
        label: Empresa
        type: object
        fields:
          - { name: nombre, label: Nombre de la empresa, type: string }
          - { name: eslogan, label: Eslogan, type: string }
          - { name: descripcion, label: Descripción corta, type: text }
          - { name: logo, label: Logo (imagen), type: image }
      - name: hero
        label: Portada (parte superior)
        type: object
        fields:
          - { name: titulo, label: Título principal, type: string }
          - { name: subtitulo, label: Subtítulo, type: text }
          - name: boton_principal
            label: Botón principal
            type: object
            fields:
              - { name: texto, label: Texto del botón, type: string }
              - { name: enlace, label: Enlace (no cambiar si no es necesario), type: string }
          - name: boton_secundario
            label: Botón de WhatsApp
            type: object
            fields:
              - { name: texto, label: Texto del botón, type: string }
              - { name: enlace, label: Enlace (dejar como "whatsapp"), type: string }
          - name: indicadores
            label: Indicadores
            type: object
            list: true
            fields:
              - { name: valor, label: Valor (ej. 99.9%), type: string }
              - { name: etiqueta, label: Descripción, type: string }
      - name: planes
        label: Planes de internet
        type: object
        fields:
          - { name: titulo, label: Título de la sección, type: string }
          - { name: descripcion, label: Descripción, type: text }
          - { name: nota, label: Nota al pie de los planes, type: text }
          - name: items
            label: Planes
            type: object
            list: true
            fields:
              - { name: nombre, label: Nombre del plan, type: string }
              - { name: velocidad, label: Velocidad (solo número), type: string }
              - { name: unidad, label: Unidad, type: string }
              - { name: precio, label: Precio (ej. 24.90), type: string }
              - { name: periodo, label: Periodo (ej. /mes), type: string }
              - { name: destacado, label: Plan destacado, type: boolean }
              - { name: etiqueta, label: Etiqueta (ej. Más elegido), type: string }
              - { name: caracteristicas, label: Características, type: string, list: true }
              - { name: boton, label: Texto del botón, type: string }
      - name: servicios
        label: Servicios adicionales
        type: object
        fields:
          - { name: titulo, label: Título de la sección, type: string }
          - { name: descripcion, label: Descripción, type: text }
          - name: items
            label: Servicios
            type: object
            list: true
            fields:
              - { name: titulo, label: Nombre del servicio, type: string }
              - { name: descripcion, label: Descripción, type: text }
              - name: icono
                label: Ícono
                type: select
                options:
                  values: [fibra, seguridad, wifi, soporte]
      - name: contacto
        label: Contacto y ubicación
        type: object
        fields:
          - { name: titulo, label: Título de la sección, type: string }
          - { name: descripcion, label: Descripción, type: text }
          - name: telefono
            label: Teléfono
            type: object
            fields:
              - { name: texto, label: Cómo se muestra, type: string }
              - { name: enlace, label: Número con código de país (+593...), type: string }
          - name: whatsapp
            label: WhatsApp
            type: object
            fields:
              - { name: texto, label: Cómo se muestra, type: string }
              - { name: numero, label: Número sin + ni espacios (593...), type: string }
              - { name: mensaje, label: Mensaje inicial, type: text }
          - { name: correo, label: Correo, type: string }
          - { name: direccion, label: Dirección, type: string }
          - { name: horario, label: Horario de atención, type: string }
          - { name: mapa_url, label: Enlace del mapa (OpenStreetMap embed), type: text }
      - name: footer
        label: Pie de página
        type: object
        fields:
          - { name: texto_legal, label: Texto legal, type: string }
          - name: enlaces
            label: Enlaces legales
            type: object
            list: true
            fields:
              - { name: texto, label: Texto, type: string }
              - { name: enlace, label: Enlace, type: string }
          - name: redes
            label: Redes sociales
            type: object
            list: true
            fields:
              - { name: texto, label: Red social, type: string }
              - { name: enlace, label: URL completa, type: string }
